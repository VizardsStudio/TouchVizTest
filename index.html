<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Unity Web Player | My project</title>
    <link rel="stylesheet" href="assets/Style.css">
</head>

<body style="text-align: center; padding: 0; border: 0; margin: 0;">

    <div id="fullscreenOverlay">
        <h1>Tap to enter fullscreen</h1>
    </div>

    <div id="ApplicationWindow">
        <canvas id="unity-canvas" width="1511" height="850" tabindex="-1"
            style="width: 1511px; height: 850px; background: #231F20"></canvas>

        <div id="rotateOverlay">
            <img src="assets/rotate-icon.png" alt="Rotate your phone" />
            <h1>Please rotate your phone</h1>
        </div>

        <!-- Download overlay -->
        <div id="downloadOverlay" style="position:absolute; top:0; left:0; width:100%; height:100%; 
                display:none; align-items:center; justify-content:center; 
                background:rgba(0,0,0,0.6); color:white; cursor:pointer; font-size:24px;">
            <p>Click here to download</p>
        </div>

        <!--map overlay-->
        <div id="mapOverlay" style="position:absolute; top:0; left:0; width:100%; height:100%; 
            display:none; flex-direction:column; background:white; z-index:5;">
            <div style="text-align:right; padding:10px; background:#222; color:white;">
                <button onclick="closeMapOverlay()"
                    style="background:red; color:white; border:none; padding:6px 12px; cursor:pointer; border-radius:6px;">Close</button>
            </div>
            <iframe id="mapFrame" src="" style="flex:1; border:none; width:100%;"></iframe>
        </div>
    </div>

    <div id="center-table">
        <div id="center-cell">
            <img id="logo" src="assets/Logo.png" alt="Logo">
            <p id="logo-text">Application developed by Vizards Studio.</p>
            <div id="loadingText">Loading... 0%</div>
        </div>
    </div>
    <div id="LoadingBar"></div>

    <script src="Build/TouchVizTest.loader.js"></script>
    <script>

        const canvas = document.querySelector("#unity-canvas");
        const applicationWindow = document.querySelector("#ApplicationWindow");
        const loadingText = document.getElementById("loadingText");
        const loadingBar = document.getElementById("LoadingBar");
        const logo = document.getElementById("logo");
        const logoText = document.getElementById("logo-text");
        const CenterTable = document.getElementById("center-table");
        let isMobile = false;
        const testing = false;

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            isMobile = true;
        }
        function setupDownload(link) {
            const overlay = document.getElementById("downloadOverlay");
            overlay.style.display = "flex";
            overlay.addEventListener("click", () => {
                window.open(link, "_blank");
                overlay.style.display = "none"; // hide overlay after click
            });
        }

        function openMapOverlay(url) {
            const overlay = document.getElementById("mapOverlay");
            const frame = document.getElementById("mapFrame");
            frame.src = url;
            overlay.style.display = "flex";
        }

        function closeMapOverlay() {
            const overlay = document.getElementById("mapOverlay");
            const frame = document.getElementById("mapFrame");
            frame.src = ""; // clear for cleanup
            overlay.style.display = "none";
        }


        /*
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            isMobile = true;
            const meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);

            canvas.style.width = "100%";
            canvas.style.height = "100%";
            canvas.style.position = "fixed";
            document.body.style.textAlign = "left";
        }
        */

        // Your original onUnityLoad
        function onUnityLoad() {
            unityInstance.SendMessage("ApplicationManager", "selectUnitByURL", GetQueryId());
            showFullscreenTapRequest();
        }

        function GetQueryId() {
            const params = new URLSearchParams(window.location.search);
            for (const [key, value] of params.entries()) {
                if (key.toLowerCase() === "id") {
                    return value;
                }
            }
            return "-1";
        }

        function checkOrientation() {
            if (!testing) {
                if (window.matchMedia("(orientation: portrait)").matches) {
                    document.getElementById("rotateOverlay").style.display = "flex";
                } else {
                    document.getElementById("rotateOverlay").style.display = "none";
                }
            }

        }
        function showFullscreenTapRequest() {
            if (isMobile) {
                const overlay = document.getElementById("fullscreenOverlay");
                overlay.style.display = "flex"; // show overlay

                // Click listener triggers fullscreen
                overlay.addEventListener("click", enterFullscreen);
            }
        }

        function enterFullscreen() {
            console.log("fullscreen function is called");
            const canvas = applicationWindow;
            if (canvas.requestFullscreen) {
                canvas.requestFullscreen();
            } else if (canvas.webkitRequestFullscreen) { // Safari / iOS
                canvas.webkitRequestFullscreen();
            } else if (canvas.msRequestFullscreen) { // IE/Edge
                canvas.msRequestFullscreen();
            }
            resizeCanvas();
            //startOrientationWatcher();
            // Hide overlay after fullscreen request
            document.getElementById("fullscreenOverlay").style.display = "none";
        }

        function startOrientationWatcher() {
            // Run check immediately
            checkOrientation();

            // Start polling every 500ms (adjust if needed)
            orientationCheckInterval = setInterval(checkOrientation, 500);
        }

        function stopOrientationWatcher() {
            if (orientationCheckInterval) {
                clearInterval(orientationCheckInterval);
                orientationCheckInterval = null;
            }
        }

        createUnityInstance(canvas,
            {
                dataUrl: "Build/TouchVizTest.data",
                frameworkUrl: "Build/TouchVizTest.framework.js",
                codeUrl: "Build/TouchVizTest.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "DefaultCompany",
                productName: "My project",
                productVersion: "0.1.0",
            }, (progress) => {
                const percent = Math.round(progress * 100);
                loadingText.innerText = `Loading... ${percent}%`;
                loadingBar.style.width = `${percent}%`;

                if (progress === 1) {
                    loadingText.style.display = 'none';
                    loadingBar.style.display = 'none';
                    logo.style.display = 'none';
                    logoText.style.display = 'none';
                    CenterTable?.remove();
                }
            }).then((instance) => {
                window.unityInstance = instance;
                loadingText.style.display = 'none';
                loadingBar.style.display = 'none';
                logo.style.display = 'none';
                logoText.style.display = 'none';
                CenterTable?.remove();

                onUnityLoad(); // Call your custom hook here
            }).catch((err) => {
                loadingText.innerText = "Failed to load Unity content.";
                console.error(err);
            });

        function resizeCanvas() {
            const aspect = 16 / 9;
            let width = window.innerWidth;
            let height = window.innerHeight;
            if (width / height > aspect) width = height * aspect;
            else height = width / aspect;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('load', checkOrientation);
        window.addEventListener("orientationchange", checkOrientation);
        if (testing) {
            window.addEventListener("load", () => {
                showFullscreenTapRequest();
            });
            window.addEventListener("load", openMapOverlay("https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6669.219696097678!2d44.39417531593956!3d33.302868591384716!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x15577f67a0a74193%3A0x9deda9d2a3b16f2c!2sBaghdad%2C%20Baghdad%20Governorate!5e0!3m2!1sen!2siq!4v1755975821900!5m2!1sen!2siq"))
        }


    </script>
</body>

</html>
